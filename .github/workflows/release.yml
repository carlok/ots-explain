name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Build twice; the two builds must be byte-identical
        run: |
          npm run build && sha256sum dist/index.html > /tmp/a
          npm run build && sha256sum dist/index.html > /tmp/b
          cmp /tmp/a /tmp/b
      - name: dist matches the committed file
        run: git diff --exit-code -- dist/index.html
      - name: Checksums
        run: |
          mkdir release && cp dist/index.html release/ots-explain.html
          cp python/verify_ots.py python/ots_stamp.py release/
          npm sbom --sbom-format cyclonedx --omit dev > release/sbom.cdx.json || true
          (cd release && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with: { subject-path: "release/*" }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: true
