name: pages
# Publishes dist/index.html (one file) to GitHub Pages. Pages cannot set response headers, so the page's own
# <meta> CSP is what applies there; for frame-ancestors and the other headers use contrib/_headers on a host that supports them.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: dist matches the committed file (the page that was tested is the page that ships)
        run: git diff --exit-code -- dist/index.html
      - run: mkdir _site && cp dist/index.html _site/index.html && touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
